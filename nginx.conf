server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带内容 hash，可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA 路由回退（项目使用 hash 路由，此处兜底保证任意路径可用）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
